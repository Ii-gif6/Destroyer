<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Destroyer - Smiley Tech</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #008080;
    font-family: 'Courier New', Courier, monospace;
    image-rendering: pixelated;
  }

  /* ========== WINDOWS 95 FULLSCREEN SHELL ========== */
  #win95 {
    position: fixed; inset: 0;
    background: #008080; /* classic teal desktop */
    display: flex; flex-direction: column;
    z-index: 1000;
    image-rendering: pixelated;
  }
  #win95.hidden { display: none; }

  /* Taskbar */
  #taskbar {
    height: 28px; background: #c0c0c0;
    border-top: 2px solid #fff;
    display: flex; align-items: center; padding: 0 4px;
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
    box-shadow: inset 1px 0 #fff;
  }
  #start-btn {
    background: #c0c0c0; border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 1px 8px; font-size: 12px; font-weight: bold;
    display: flex; align-items: center; gap: 4px;
    height: 22px; margin-right: 6px;
  }
  #start-btn:active { border-color: #808080 #fff #fff #808080; }
  #start-btn img { width: 16px; height: 16px; image-rendering: pixelated; }
  #task-window {
    background: #c0c0c0; border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 1px 10px; font-size: 12px; height: 22px;
    display: flex; align-items: center;
  }
  #clock {
    margin-left: auto; font-size: 12px; padding: 2px 6px;
    border: 1px solid; border-color: #808080 #fff #fff #808080;
  }

  /* Main window (fullscreen almost) */
  #main-window {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 32px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    display: flex; flex-direction: column;
    box-shadow: 2px 2px 0 #000;
  }
  #titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff; font-size: 13px; font-weight: bold;
    padding: 3px 4px; display: flex; align-items: center;
    height: 22px; flex-shrink: 0;
  }
  #titlebar .icon {
    width: 16px; height: 16px; margin-right: 5px;
    image-rendering: pixelated; background: #ff0;
  }
  #titlebar .title { flex: 1; white-space: nowrap; overflow: hidden; }
  #titlebar .btns { display: flex; gap: 2px; }
  #titlebar .btn {
    width: 16px; height: 14px; background: #c0c0c0;
    border: 1px solid; border-color: #fff #000 #000 #fff;
    font-size: 9px; line-height: 12px; text-align: center;
    color: #000; font-weight: bold;
  }

  /* Content area inside the window */
  #content {
    flex: 1; background: #000; position: relative;
    border: 2px solid; border-color: #808080 #fff #fff #808080;
    margin: 2px; overflow: hidden;
    image-rendering: pixelated;
  }

  /* ===== DOS BOOT inside the window ===== */
  #boot-screen {
    position: absolute; inset: 0; background: #000;
    color: #aaa; font-size: clamp(10px, 2.4vw, 13px);
    padding: 8px 10px; line-height: 1.35;
    overflow: hidden; white-space: pre-wrap;
    image-rendering: pixelated;
  }
  #boot-screen.green { color: #0f0; }
  #boot-screen .line { opacity: 0; }
  #boot-screen .line.visible { opacity: 1; }
  #boot-screen .bright { color: #eee; }
  #boot-screen .dim { color: #666; }
  #boot-screen .ok { color: #0f0; }
  #boot-screen .warn { color: #ff0; }

  /* ===== TITLE SCREEN "DESTROYER" ===== */
  #title-screen {
    position: absolute; inset: 0; background: #000;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    image-rendering: pixelated; z-index: 5;
  }
  #title-screen .logo {
    width: min(45vw, 180px); height: auto;
    image-rendering: pixelated;
    filter: contrast(1.3) brightness(1.1);
    margin-bottom: 12px;
    animation: titlePulse 1.8s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  #title-screen h1 {
    font-size: clamp(2.2rem, 11vw, 4.2rem);
    color: #f00;
    text-shadow:
      3px 3px 0 #800,
      -1px -1px 0 #ff0,
      0 0 20px #f00;
    letter-spacing: 4px;
    margin-bottom: 6px;
    image-rendering: pixelated;
  }
  #title-screen .sub {
    color: #ff0; font-size: clamp(0.9rem, 3.5vw, 1.2rem);
    letter-spacing: 3px; margin-bottom: 28px;
  }
  #title-screen .press {
    color: #0f0; font-size: clamp(0.85rem, 3vw, 1.1rem);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0; }
  }
  #title-screen .cred {
    position: absolute; bottom: 18px; color: #666;
    font-size: 11px; text-align: center; line-height: 1.4;
  }

  /* CRT overlay for whole content */
  .crt-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.12),
      rgba(0,0,0,0.12) 1px,
      transparent 1px,
      transparent 2px
    );
  }

  /* ===== ACTUAL GAME ===== */
  #game {
    display: none; width: 100%; height: 100%; position: relative;
    image-rendering: pixelated;
  }
  canvas#view {
    display: block; width: 100%; height: 100%; background: #000;
    image-rendering: pixelated;
  }
  #controls {
    position: absolute; inset: 0; pointer-events: none; z-index: 10;
  }
  .stick-zone {
    position: absolute; bottom: 20px; width: 130px; height: 130px;
    pointer-events: auto; border-radius: 50%;
    background: rgba(255,255,255,0.07); border: 2px solid rgba(255,200,0,0.35);
  }
  #moveStick { left: 16px; }
  #lookStick { right: 16px; }
  .stick-knob {
    position: absolute; width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255, 180, 0, 0.75); border: 3px solid #ff0;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 10px #f80; pointer-events: none;
  }
  #btnShoot {
    position: absolute; bottom: 170px; right: 28px; width: 68px; height: 68px;
    border-radius: 50%; background: rgba(200, 30, 30, 0.8);
    border: 3px solid #f44; color: #fff; font-weight: bold; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; box-shadow: 0 0 12px #f00;
  }
  #btnShoot:active, #btnShoot.active { background: #f00; transform: scale(0.92); }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; padding: 6px 10px;
    display: flex; justify-content: space-between; color: #0f0;
    font-size: 13px; text-shadow: 0 0 3px #000; pointer-events: none; z-index: 5;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  #msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #ff0; font-size: 1.3rem; text-align: center; text-shadow: 0 0 8px #f00;
    pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.3s;
  }
  #msg.show { opacity: 1; }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
    transform: translate(-50%, -50%); pointer-events: none; z-index: 4;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #0f0;
  }
  #crosshair::before { width: 2px; height: 100%; left: 8px; top: 0; }
  #crosshair::after { height: 2px; width: 100%; top: 8px; left: 0; }
  .weapon {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 160px; height: 110px; pointer-events: none; z-index: 3;
    background: linear-gradient(to top, #333 30%, #555 60%, transparent);
    clip-path: polygon(20% 100%, 30% 40%, 40% 20%, 50% 10%, 60% 20%, 70% 40%, 80% 100%);
    opacity: 0.9;
  }
  .weapon.fire { animation: recoil 0.15s; }
  @keyframes recoil {
    0% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(10px); }
    100% { transform: translateX(-50%) translateY(0); }
  }
</style>
</head>

const bgm = document.getElementById('bgm');

function startMusic() {
  if (!bgm) return;

}

});

// ========== WINDOWS 95 CLOCK ==========
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock').textContent = h + ':' + m + ' ' + ampm;
}

  requestAnimationFrame(() => div.classList.add('visible'));

}

// Touch sticks
function setupStick(zoneId, knobId, isLook) {
  const zone = document.getElementById(zoneId);
  const knob = document.getElementById(knobId);
  let activeId = null;
  const maxR = 42;

  function update(dx, dy) {
    const dist = Math.hypot(dx, dy);
    const clamped = Math.min(dist, maxR);
    const ang = Math.atan2(dy, dx);
    const kx = Math.cos(ang) * clamped;
    const ky = Math.sin(ang) * clamped;
    knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
    const nx = dist > 8 ? kx / maxR : 0;
    const ny = dist > 8 ? ky / maxR : 0;
    if (isLook) {
      input.lookX = nx;
    } else {
      input.moveX = nx;
      input.moveY = ny;
    }
  }

  function onStart(e) {
    startMusic();
    e.preventDefault();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    activeId = t.identifier !== undefined ? t.identifier : 'mouse';
    const rect = zone.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    update(t.clientX - cx, t.clientY - cy);
  }
  function onMove(e) {
    if (activeId === null) return;
    e.preventDefault();
    const touches = e.changedTouches || [e];
    for (const t of touches) {
      if ((t.identifier !== undefined ? t.identifier : 'mouse') === activeId) {
        const rect = zone.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        update(t.clientX - cx, t.clientY - cy);
        break;
      }
    }
  }
  function onEnd(e) {
    const touches = e.changedTouches || [e];
    for (const t of touches) {
      if ((t.identifier !== undefined ? t.identifier : 'mouse') === activeId) {
        activeId = null;
        knob.style.transform = 'translate(-50%, -50%)';
        if (isLook) input.lookX = 0;
        else { input.moveX = 0; input.moveY = 0; }
        break;
      }
    }
  }

  zone.addEventListener('touchstart', onStart, {passive:false});
  zone.addEventListener('touchmove', onMove, {passive:false});
  zone.addEventListener('touchend', onEnd, {passive:false});
  zone.addEventListener('touchcancel', onEnd, {passive:false});
  // mouse for desktop testing
  zone.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}

const shootBtn = document.getElementById('btnShoot');
function startShoot(e) { startMusic(); e.preventDefault(); input.shooting = true; shootBtn.classList.add('active'); }
function endShoot(e) { e.preventDefault(); input.shooting = false; shootBtn.classList.remove('active'); }
shootBtn.addEventListener('touchstart', startShoot, {passive:false});
shootBtn.addEventListener('touchend', endShoot, {passive:false});
shootBtn.addEventListener('mousedown', startShoot);
shootBtn.addEventListener('mouseup', endShoot);

// Raycasting helpers
function isWall(x, y) {
  const mx = Math.floor(x / TILE);
  const my = Math.floor(y / TILE);
  if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) return true;
  return map[my][mx] === 1;
}

function castRay(angle) {
  const sin = Math.sin(angle);
  const cos = Math.cos(angle);
  let dist = 0;
  const step = 2;
  let hitX = player.x, hitY = player.y;
  let side = 0; // 0=vert, 1=horiz for shading
  while (dist < 800) {
    dist += step;
    hitX = player.x + cos * dist;
    hitY = player.y + sin * dist;
    if (isWall(hitX, hitY)) {
      // approximate side
      const prevX = player.x + cos * (dist - step);
      const prevY = player.y + sin * (dist - step);
      if (Math.floor(prevX/TILE) !== Math.floor(hitX/TILE)) side = 0;
      else side = 1;
      break;
    }
  }
  // fisheye correction
  const corr = dist * Math.cos(angle - player.angle);
  return { dist: corr, side, hitX, hitY };
}

function showMsg(text, ms=1500) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

let lastShot = 0;
function tryShoot() {
  const now = performance.now();
  if (now - lastShot < 280) return;
  if (player.ammo <= 0) { showMsg('OUT OF AMMO'); return; }
  lastShot = now;
  player.ammo--;
  document.getElementById('ammo').textContent = player.ammo;
  document.getElementById('weapon').classList.remove('fire');
  void document.getElementById('weapon').offsetWidth;
  document.getElementById('weapon').classList.add('fire');

  // hitscan
  const ray = castRay(player.angle);
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > ray.dist) continue;
    const ang = Math.atan2(dy, dx);
    let da = ang - player.angle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    if (Math.abs(da) < 0.18 && dist < 450) {
      e.hp -= 15;
      e.flash = 8;
      if (e.hp <= 0) {
        e.alive = false;
        player.kills++;
        document.getElementById('kills').textContent = player.kills;
        showMsg('ENEMY DOWN!');
        if (enemies.every(en => !en.alive)) {
          setTimeout(() => showMsg('YOU WIN! ALL CLEAR', 4000), 600);
        }
      }
      break;
    }
  }
}

function update(dt) {
  // movement
  const moveSpeed = player.speed * (dt / 16);
  const rot = player.rotSpeed * input.lookX * (dt / 16) * 2.2;

  player.angle += rot;

  // forward / strafe relative to angle
  const fx = Math.cos(player.angle);
  const fy = Math.sin(player.angle);
  const rx = Math.cos(player.angle + Math.PI/2);
  const ry = Math.sin(player.angle + Math.PI/2);

  let nx = player.x + fx * (-input.moveY) * moveSpeed * 1.4 + rx * input.moveX * moveSpeed;
  let ny = player.y + fy * (-input.moveY) * moveSpeed * 1.4 + ry * input.moveX * moveSpeed;

  // simple collision
  if (!isWall(nx, player.y)) player.x = nx;
  if (!isWall(player.x, ny)) player.y = ny;

  // keep in bounds soft
  player.x = Math.max(TILE*0.3, Math.min(player.x, (MAP_W-0.3)*TILE));
  player.y = Math.max(TILE*0.3, Math.min(player.y, (MAP_H-0.3)*TILE));

  if (input.shooting) tryShoot();

  // enemy simple AI: move slowly toward player if close, damage if very close
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.flash > 0) e.flash--;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.hypot(dx, dy);
    if (d < 40) {
      player.hp = Math.max(0, player.hp - 0.15 * (dt/16));
      document.getElementById('hp').textContent = Math.floor(player.hp);
      if (player.hp <= 0) {
        showMsg('YOU DIED - RELOAD PAGE', 5000);
        input.moveX = input.moveY = input.lookX = 0;
      }
    } else if (d < 280) {
      const spd = 0.9 * (dt/16);
      const mx = e.x + (dx/d) * spd;
      const my = e.y + (dy/d) * spd;
      if (!isWall(mx, e.y)) e.x = mx;
      if (!isWall(e.x, my)) e.y = my;
    }
  }
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  // ceiling / floor
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(0.5, '#0d0d15');
  grad.addColorStop(0.5, '#1a1208');
  grad.addColorStop(1, '#2a1a0a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // rays
  const numRays = Math.min(w, 320); // performance on mobile
  const rayW = w / numRays;
  for (let i = 0; i < numRays; i++) {
    const rayAngle = player.angle - player.fov/2 + (i / numRays) * player.fov;
    const { dist, side } = castRay(rayAngle);
    const wallH = Math.min(h * 1.8, (TILE * 1.6 * h) / (dist + 0.1));
    const top = (h - wallH) / 2;
    // color by distance + side
    const shade = Math.max(0.15, 1 - dist / 700);
    let r = Math.floor(180 * shade * (side ? 0.7 : 1));
    let g = Math.floor(40 * shade);
    let b = Math.floor(20 * shade);
    // slight variation
    if (side) { r = Math.floor(r * 0.75); g = Math.floor(g * 0.75); }
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(i * rayW, top, rayW + 1, wallH);
  }

  // draw enemies as simple sprites (billboard)
  const visibles = [];
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    const dist = Math.hypot(dx, dy);
    let ang = Math.atan2(dy, dx) - player.angle;
    while (ang > Math.PI) ang -= Math.PI*2;
    while (ang < -Math.PI) ang += Math.PI*2;
    if (Math.abs(ang) < player.fov/2 + 0.2) {
      visibles.push({ e, dist, ang });
    }
  }
  visibles.sort((a,b) => b.dist - a.dist);
  for (const { e, dist, ang } of visibles) {
    const screenX = (0.5 + ang / player.fov) * w;
    const size = Math.min(h*0.9, (TILE * 1.4 * h) / (dist + 1));
    const top = (h - size) / 2;
    // body
    const flash = e.flash > 0;
    ctx.fillStyle = flash ? '#fff' : '#c22';
    ctx.beginPath();
    ctx.ellipse(screenX, top + size*0.55, size*0.28, size*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    // head (smiley-ish)
    ctx.fillStyle = flash ? '#ff0' : '#eee';
    ctx.beginPath();
    ctx.arc(screenX, top + size*0.28, size*0.18, 0, Math.PI*2);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(screenX - size*0.07, top + size*0.25, size*0.04, 0, Math.PI*2);
    ctx.arc(screenX + size*0.07, top + size*0.25, size*0.04, 0, Math.PI*2);
    ctx.fill();
    // grin
    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(2, size*0.03);
    ctx.beginPath();
    ctx.arc(screenX, top + size*0.32, size*0.1, 0.2, Math.PI - 0.2);
    ctx.stroke();
  }
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(40, now - lastTime);
  lastTime = now;
  if (player.hp > 0) update(dt);
  draw();
  requestAnimationFrame(loop);
}

function initGame() {
  startMusic();
  setupStick('moveStick', 'moveKnob', false);
  setupStick('lookStick', 'lookKnob', true);
  showMsg('MOVE • LOOK • FIRE', 2500);
  requestAnimationFrame(loop);
}

// Prevent scroll/zoom
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
